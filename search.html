<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAMMPS Manual Search — NVT/NPT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;color:#333;max-width:960px;margin:0 auto;padding:24px 20px}

h1{font-size:22px;margin-bottom:2px}
.sub{color:#999;font-size:12px;margin-bottom:24px}

/* search bar */
.search-wrap{position:relative;margin-bottom:24px}
.search-bar{display:flex;gap:8px}
.search-bar input{flex:1;padding:12px 16px;font-size:15px;border:2px solid #ddd;border-radius:8px;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:#5e81ac}
.search-bar button{padding:12px 20px;font-size:15px;background:#5e81ac;color:#fff;border:none;border-radius:8px;cursor:pointer}
.search-bar button:hover{background:#4a6d96}

/* phase filters */
.filter-bar{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.filter-bar button{padding:4px 14px;font-size:11px;border:1px solid #ddd;border-radius:16px;background:#fff;color:#888;cursor:pointer;transition:all .15s}
.filter-bar button:hover,.filter-bar button.active{border-color:#5e81ac;color:#5e81ac;background:#eef2f7}

/* result card — VASP-style */
.result{border:1px solid #e8e6dd;border-radius:10px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .15s;display:flex;gap:14px}
.result:hover{background:#fff;border-color:#d5d3c8}
.result.sel{background:#eef2f7;border-color:#5e81ac}
.result .rank{font-size:20px;color:#bbb;min-width:26px;font-weight:700;text-align:right;line-height:1.4}
.result .info{flex:1;min-width:0}
.result .title{font-size:15px;font-weight:600;color:#2e3440}
.result .type{font-size:9px;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:3px;margin-left:8px;display:inline}
.type.init{background:#fce8eb;color:#9b4058}.type.system{background:#dce6f5;color:#3b5d80}
.type.force{background:#dce8d8;color:#4d6b42}.type.integ{background:#e8ddf0;color:#5a3d7a}
.type.compute{background:#dce6f5;color:#3b5d80}.type.output{background:#fde5d5;color:#8a4a28}
.type.howto{background:#eee;color:#777}
.result .synopsis{font-size:12px;color:#888;margin-top:4px;line-height:1.5}
.result .snippet{font-size:11px;color:#999;margin-top:4px;line-height:1.4}
.result .snippet b{color:#555;background:#fef9e7;padding:0 2px}
.result .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.result .tags span{font-size:9px;background:#f0efec;padding:1px 6px;border-radius:3px;color:#999}

/* detail panel — rich command doc */
.detail{display:none;border:1px solid #d8e0e8;border-radius:12px;padding:24px;margin:20px 0;background:#fafcfd;overflow:hidden}
.detail.on{display:block}
.detail h2{font-size:18px;color:#2e3440;margin-bottom:6px}
.detail .synop{font-size:14px;color:#666;margin-bottom:4px}
.detail h3{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid #eee}
.detail .syntax{background:#f5f4f0;border:1px solid #e8e6dd;border-radius:6px;padding:12px 16px;font-family:SFMono,Consolas,monospace;font-size:13px;white-space:pre-wrap;color:#4a6d96;line-height:1.7}
.detail .desc{font-size:13px;line-height:1.8;color:#555;margin:8px 0}
.detail table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.detail th{text-align:left;padding:8px 12px;font-size:10px;color:#999;border-bottom:2px solid #eee;text-transform:uppercase}
.detail td{padding:7px 12px;border-bottom:1px solid #f5f4f0;vertical-align:top}
.detail td.kw{color:#7c5da0;font-family:SFMono,Consolas,monospace;font-weight:600;font-size:12px}
.detail td.dv{color:#3b5d80;font-family:SFMono,Consolas,monospace;font-size:12px}
.detail .example{background:#f5f4f0;border:1px solid #e8e6dd;border-radius:6px;padding:8px 12px;font-family:SFMono,Consolas,monospace;font-size:13px;margin-bottom:6px;color:#4d6b42}

/* relation badges */
.rel-wrap{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}
.rel-grp{min-width:140px}
.rel-grp .lbl{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.rel-grp a{display:block;font-size:12px;color:#5e81ac;text-decoration:none;padding:1px 0;cursor:pointer}
.rel-grp a:hover{text-decoration:underline}

.doc-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#5e81ac;text-decoration:none;margin:16px 0 0;padding:5px 12px;border:1px solid #d8e2f0;border-radius:14px;transition:all .15s}
.doc-link:hover{background:#eef2f7}

.restrict{font-size:11px;color:#b8860b;line-height:1.7;padding:8px 12px;background:#fef9e7;border-radius:6px;margin:8px 0}

.meta{font-size:10px;color:#bbb;text-align:center;margin-top:20px}
.empty{text-align:center;padding:60px 20px;color:#bbb}
.empty .icon{font-size:48px;margin-bottom:12px}
.hint{font-size:12px;color:#999;margin-top:8px}
.nav{font-size:11px;color:#bbb;margin-bottom:16px}
.nav a{color:#5e81ac;text-decoration:none}
</style>
</head>
<body>
<h1>LAMMPS Manual Search</h1>
<div class="sub">NVT/NPT molecular dynamics — 22 command pages with syntax, keywords & examples</div>

<div class="nav"><a href="graph.html">→ Explore relationship graph</a></div>

<div class="search-wrap">
  <div class="search-bar">
    <input id="q" placeholder="Search commands... (e.g. nvt thermostat, Pdamp, Nose-Hoover, timestep, fix npt)"
           autofocus autocomplete="off" oninput="doSearch()">
  </div>
  <div class="filter-bar" id="filters"></div>
</div>

<div id="results"><div class="empty"><div class="icon">&#128269;</div><div>Browse commands or type to search</div><div class="hint">Try: thermostat, fix npt, Pdamp, Nose-Hoover, pair_style</div></div></div>
<div class="detail" id="detail"></div>
<div class="meta" id="meta"></div>

<script>
const PHC={init:"#c47482",system:"#5e81ac",force:"#6b9e5a",integ:"#7c5da0",compute:"#5e81ac",output:"#d4745c",howto:"#999"};
const PHL={init:"Init",system:"Build",force:"Force",integ:"Integrator",compute:"Compute",output:"Output",howto:"Guide"};
const PO=["init","system","force","integ","compute","output","howto"];

let D=null, filt='', sel=null;
(async()=>{const r=await fetch('graph_data.json');D=await r.json();init();})();

function init(){
  document.getElementById('filters').innerHTML=
    '<button class="active" data-p="" onclick="setF(\'\')">All</button>'+
    PO.map(ph=>{
      const c=D.nodes.filter(n=>n.phase===ph).length;
      return`<button data-p="${ph}" onclick="setF('${ph}')">${PHL[ph]} (${c})</button>`;
    }).join('');
  doSearch();
}

function setF(f){filt=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.toggle('active',b.dataset.p===f));doSearch();}

// Highlight matching text
function hl(text, query){
  if(!query)return text;
  const toks=query.toLowerCase().split(/\s+/).filter(Boolean);
  let r=text;
  toks.forEach(t=>{try{r=r.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<b>$1</b>');}catch(e){}});
  return r;
}

function doSearch(){
  document.getElementById('detail').classList.remove('on');sel=null;
  const q=(document.getElementById('q').value||'').trim();
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length){
    // No query: show all (browse mode)
    const all=D.nodes.filter(n=>!filt||n.phase===filt);
    renderResults(all.map(n=>({n,s:0,source:'browse'})),q);
    return;
  }

  // Phase 1: BM25 text search
  const scored={};
  D.nodes.forEach(n=>{
    if(filt&&n.phase!==filt)return;
    const txt=(n.title+' '+n.synopsis+' '+n.description+' '+n.syntax+' '+(n.keywords?Object.keys(n.keywords).join(' '):'')).toLowerCase();
    let s=0; toks.forEach(t=>{if(n.title.toLowerCase().includes(t))s+=20;else if(txt.includes(t))s+=10;});
    if(s>0)scored[n.id]={n,s,source:'text match'};
  });

  // Phase 2: Graph expansion — follow edges, track relationship type
  const boostMap={}; // id → {score, relTypes: Set}
  for(const[id,entry]of Object.entries(scored)){
    const edges=D.edges.filter(e=>e.from===id||e.to===id);
    edges.forEach(e=>{
      const otherId=e.from===id?e.to:e.from;
      const w=e.weight||2;
      if(!boostMap[otherId])boostMap[otherId]={score:0,relTypes:new Set(),edges:[]};
      boostMap[otherId].score+=(entry.s*w/100);
      boostMap[otherId].relTypes.add(e.type);
      if(e.label)boostMap[otherId].edges.push(e.label);
    });
  }

  // Apply boosts
  for(const[id,info]of Object.entries(boostMap)){
    const relLabel=[...info.relTypes].join(', ');
    if(scored[id]){
      scored[id].s+=info.score;
      scored[id].source='text + graph';
      scored[id].relLabel=relLabel;
    }else{
      const n=D.nodes.find(x=>x.id===id);
      if(n&&(!filt||n.phase===filt)){
        scored[id]={n,s:info.score,source:'graph neighbor',relLabel};
      }
    }
  }

  const results=Object.values(scored).sort((a,b)=>b.s-a.s);

  const el=document.getElementById('results');
  if(!results.length){el.innerHTML='<div class="empty"><div class="icon">&#128533;</div><div>No results</div><div class="hint">Try different keywords</div></div>';document.getElementById('meta').textContent='';return;}

  // Find snippet for text-matched results
  results.forEach(r=>{
    if(r.source==='graph neighbor')return;
    const lines=(r.n.description||'').split(/[.\n]/);
    r.snippet=(lines.find(l=>toks.some(t=>l.toLowerCase().includes(t)))||'').trim().substring(0,200);
  });

  renderResults(results,q);
}

function renderResults(results,q){
  const el=document.getElementById('results');
  const txt=results.filter(r=>r.source==='text + graph'||r.source==='text match').length;
  const nb=results.filter(r=>r.source==='graph neighbor').length;

  el.innerHTML=results.map(r=>{
    const n=r.n;
    const kwList=n.keywords?Object.keys(n.keywords).slice(0,6):[];
    const relMap={requires:'requires',incompatible:'incompatible',creates:'creates',alternative:'alternative',related:'see also',howto_ref:'guide'};
    const neighborMark=r.relLabel?`<span style="font-size:9px;color:#999;margin-left:4px">· ${r.relLabel.split(', ').map(t=>relMap[t]||t).join(', ')}</span>`:'';
    return`<div class="result${sel===n?' sel':''}" onclick="showDetail('${n.id}')">
      <div class="rank">${r.s>1?Math.round(r.s):''}</div>
      <div class="info">
        <span class="title">${hl(n.title,q||'')}${neighborMark}</span><span class="type ${n.phase}">${PHL[n.phase]}</span>
        <div class="synopsis">${n.synopsis||''}</div>
        ${r.snippet?`<div class="snippet">${hl(r.snippet,q||'')}</div>`:''}
        ${kwList.length?`<div class="tags">${kwList.map(k=>`<span>${k}</span>`).join('')}</div>`:''}
      </div></div>`;
  }).join('');
  const info=[`${results.length} results`];
  if(txt)info.push(`${txt} from text`);
  if(nb)info.push(`${nb} by graph`);
  document.getElementById('meta').textContent=info.join(' · ');
}

function showDetail(id){
  sel=D.nodes.find(n=>n.id===id);if(!sel)return;

  let html=`<div style="display:flex;justify-content:space-between;align-items:start">
    <h2 style="margin-bottom:0">${sel.title} <span class="type ${sel.phase}">${PHL[sel.phase]}</span></h2>
    <span onclick="document.getElementById('detail').classList.remove('on');sel=null;document.querySelectorAll('.result').forEach(r=>r.classList.remove('sel'));"
          style="cursor:pointer;color:#bbb;font-size:18px;line-height:1;padding:4px" title="Close">✕</span></div>
    <div class="synop">${sel.synopsis||''}</div>`;
  if(sel.description)html+=`<div class="desc">${sel.description}</div>`;

  // Syntax
  if(sel.syntax)html+=`<h3>Syntax</h3><div class="syntax">${sel.syntax}</div>`;

  // Keywords table
  if(sel.keywords&&Object.keys(sel.keywords).length){
    html+='<h3>Keywords</h3><table><tr><th>Keyword</th><th>Type</th><th>Default</th><th>Description</th></tr>';
    for(const[k,v]of Object.entries(sel.keywords)){
      if(typeof v==='string')continue;
      html+=`<tr><td class="kw">${k}</td><td style="font-size:11px;color:#555">${v.type||''}</td>
             <td class="dv">${v.default||'—'}</td><td style="font-size:12px;color:#666">${v.desc||''}</td></tr>`;
    }
    html+='</table>';
  }

  // Examples
  if(sel.examples&&sel.examples.length){
    html+='<h3>Examples</h3>'+sel.examples.map(e=>`<div class="example">${e}</div>`).join('');
  }

  // Restrictions
  if(sel.restrictions)html+=`<h3>Restrictions</h3><div class="restrict">${sel.restrictions}</div>`;

  // Relations
  const inE=D.edges.filter(e=>e.to===id),outE=D.edges.filter(e=>e.from===id);
  const allE=[...inE,...outE].sort((a,b)=>(b.weight||0)-(a.weight||0));
  const groups={};
  allE.forEach(e=>{
    const t=e.type;if(!groups[t])groups[t]=[];
    const otherId=e.from===id?e.to:e.from;
    const other=D.nodes.find(n=>n.id===otherId);if(!other)return;
    groups[t].push({node:other,source:e.source||''});
  });
  if(Object.keys(groups).length){
    const labels={requires:'Hard dependency',incompatible:'Incompatible with',creates:'Auto-creates',related:'See also',alternative:'Alternative to',howto_ref:'Tutorial covers'};
    html+='<h3>Relationships</h3><div class="rel-wrap">';
    ['requires','incompatible','creates','alternative','related','howto_ref'].forEach(t=>{
      if(!groups[t]||!groups[t].length)return;
      html+=`<div class="rel-grp"><div class="lbl">${labels[t]||t}</div>`;
      groups[t].forEach(({node,source})=>{
        const tip=source?` title="${source.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"`:'';
        html+=`<a onclick="event.stopPropagation();showDetail('${node.id}')"${tip}>${node.title}</a>`;
      });
      html+='</div>';
    });
    html+='</div>';
  }

  if(sel.url)html+=`<a class="doc-link" href="${sel.url}" target="_blank">Open in LAMMPS docs ↗</a>`;

  const el=document.getElementById('detail');el.innerHTML=html;el.classList.add('on');
  // Highlight selected result, keep all visible
  document.querySelectorAll('.result').forEach(r=>r.classList.remove('sel'));
  const hit=document.querySelector(`[onclick*="${id}"]`);if(hit){hit.classList.add('sel');hit.scrollIntoView({behavior:'smooth',block:'center'});}
}

// Enter key
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const r=document.querySelector('.result');if(r)r.click();}
});
</script>
</body>
</html>
