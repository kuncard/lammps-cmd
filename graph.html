<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAMMPS Command Graph</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<style>
body{margin:0;padding:0;background:#fafaf7;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
/* TOP BAR */
#top{z-index:10;position:absolute;top:0;left:0;right:0;background:#fffef9;padding:6px 14px;border-bottom:1px solid #e8e6dd;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#top h1{font-size:14px;margin:0;white-space:nowrap}
#search{padding:5px 10px;border:1px solid #ddd;border-radius:4px;width:180px;font-size:12px;outline:none}
#search:focus{border-color:#5e81ac}
#match-count{font-size:10px;color:#5e81ac;display:none}
#controls{display:flex;gap:4px;align-items:center}
#controls button{font-size:10px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#666;cursor:pointer;white-space:nowrap}
#controls button:hover{border-color:#888}
#controls button.active{background:#5e81ac;color:#fff;border-color:#5e81ac}
#controls .sep{width:1px;height:16px;background:#ddd;margin:0 4px}
.stats{font-size:10px;color:#bbb;white-space:nowrap}
#legend{font-size:10px;color:#888;display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
#legend span{display:flex;align-items:center;gap:3px;cursor:pointer;padding:1px 3px;border-radius:3px}
#legend span:hover{background:#f0efe8}
#legend span.off{opacity:.3}
#legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;flex-shrink:0}
#legend .line{display:inline-block;width:14px;height:0;flex-shrink:0}
/* GRAPH */
#container{position:absolute;top:42px;bottom:0;left:0;right:0;background:#fafaf7}
/* DETAIL OVERLAY */
#detail{position:absolute;top:52px;right:16px;z-index:20;background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;width:420px;max-height:80vh;overflow-y:auto;display:none;font-size:12px;line-height:1.6;box-shadow:0 2px 20px rgba(0,0,0,.08)}
#detail h2{font-size:15px;margin:0 0 2px;color:#2e3440}
#detail .tp{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
#detail .sec{margin-bottom:14px}
#detail .sec h3{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #eee}
#detail pre{background:#f8f8f6;padding:10px 12px;border-radius:6px;font-size:11px;overflow-x:auto;border:1px solid #eee;white-space:pre-wrap;font-family:SFMono-Regular,Consolas,monospace}
#detail table{width:100%;font-size:10px;border-collapse:collapse}
#detail table th{text-align:left;color:#999;padding:3px 6px;font-weight:500;border-bottom:2px solid #eee}
#detail table td{padding:3px 6px;color:#555;border-bottom:1px solid #f0efe8}
#detail table td code{color:#c8963e;background:#fdf6e3;padding:1px 4px;border-radius:3px;font-size:10px}
#detail .rel-item{font-size:10px;padding:2px 6px;margin:1px 0;border-radius:3px;cursor:pointer;color:#5e81ac}
#detail .rel-item:hover{background:#eef2f7;color:#3b5d80}
#detail .examples li{font-size:11px;font-family:SFMono-Regular,Consolas,monospace;color:#555;margin:2px 0;padding:3px 8px;background:#f8f8f6;border-radius:4px;list-style:none}
#detail .restrict{font-size:10px;color:#bf616a;padding:6px 10px;background:#fef6f5;border-radius:6px;border-left:3px solid #bf616a}
#detail .close{position:absolute;top:8px;right:12px;font-size:18px;cursor:pointer;color:#bbb;background:none;border:none;line-height:1}
#detail a{color:#5e81ac;font-size:10px}
</style>
</head>
<body>
<div id="top">
  <h1>LAMMPS Command Graph</h1>
  <input id="search" placeholder="Search..." oninput="doSearch()" autofocus>
  <span id="match-count"></span>
  <div id="controls">
    <button id="btn-all" class="active" onclick="toggleEdges('all')">All Edges</button>
    <button id="btn-struct" onclick="toggleEdges('struct')">Key Only</button>
    <span class="sep"></span>
    <button id="btn-freeze" onclick="togglePhysics()">Freeze</button>
  </div>
  <span class="stats" id="stats"></span>
  <div id="legend"></div>
</div>
<div id="container"></div>
<div id="detail">
  <button class="close" onclick="document.getElementById('detail').style.display='none'">&times;</button>
  <h2 id="dt"></h2>
  <div class="tp" id="dty"></div>
  <div id="dc"></div>
</div>
<script>
// ── COLORS & LABELS ──
const PC = {init:'#c47482',system:'#5e81ac',force:'#7a9f6e',integ:'#b48ead',compute:'#5e81ac',output:'#d08770',howto:'#999'};
const PC_BORDER = {init:'#9b4058',system:'#3b5d80',force:'#4d6b42',integ:'#7a3d8a',compute:'#3b5d80',output:'#9e5640',howto:'#666'};
const PL = {init:'Init',system:'Build',force:'Force',integ:'Integrator',compute:'Compute',output:'Output',howto:'Guides'};
const EC = {requires:'#5e81ac',incompatible:'#bf616a',creates:'#b48ead',alternative:'#c8963e',related:'#bbb',howto_ref:'#7a9f6e',refers_to:'#a3be8c'};
const EW = {requires:1.2,incompatible:1.0,creates:1.0,alternative:0.7,related:0.4,howto_ref:0.8,refers_to:0.5};

let network = null, physicsOn = true;
let structEdges = [], allEdges = [], fullData = [], nodePhase = {}, idMap = {};
let showAll = true;

(async () => {
  let D;
  try {
    const r = await fetch('graph_data_full.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    D = await r.json();
  } catch (err) {
    document.getElementById('container').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:14px">' +
      'Failed to load graph data: ' + err.message + '<br><br>' +
      'Run <code>python build_full_graph.py</code> to rebuild.</div>';
    return;
  }

  // Build nodes
  const visNodes = [];
  const stCount = {};
  D.nodes.forEach(n => {
    stCount[n.phase] = (stCount[n.phase]||0)+1;
    const ph = n.phase||'generic';
    nodePhase[n.id] = ph;
    const sz = ph==='integ'?18 : ph==='howto'?10 : 13;
    visNodes.push({
      id:n.id, label:n.title,
      color:{background:PC[ph]||'#aaa',border:PC_BORDER[ph]||'#888'},
      size:sz, font:{size:ph==='integ'?14:ph==='howto'?10:12,color:'#333'}
    });
    fullData.push(n);
    idMap[n.id] = n;
  });

  // Legend
  const legParts = [];
  for (const ph of ['init','system','force','integ','compute','output','howto']) {
    if (stCount[ph]) legParts.push(
      `<span data-phase="${ph}" class="ph-leg"><span class="dot" style="background:${PC[ph]};border-color:${PC_BORDER[ph]}"></span>${PL[ph]} (${stCount[ph]})</span>`
    );
  }
  document.getElementById('legend').innerHTML = legParts.join('') +
    ' <span style="color:#ccc;margin:0 2px">|</span> ' +
    ['requires','incompatible','creates','alternative','howto_ref','related','refers_to'].map(t =>
      `<span class="leg-item" data-type="${t}"><span class="line" style="border-top:1.5px solid ${EC[t]}"></span>${t}</span>`
    ).join(' ');

  document.getElementById('stats').textContent = `${D.nodes.length} nodes · ${D.edges.length} edges`;

  // Build edges
  const seen = new Set();
  structEdges = []; allEdges = [];
  D.edges.forEach(e => {
    const r = e.type||'related';
    const key = `${e.from}|${e.to}|${r}`;
    if (seen.has(key)) return; seen.add(key);
    const eid = `${e.from}->${e.to}__${r}`;
    const edge = {
      id:eid, from:e.from, to:e.to, _type:r,
      color:{color:EC[r]||'#bbb',opacity:0.5},
      width: EW[r]||0.5,
      title:`<b>${r}</b> (w=${e.weight||0})<br>${e.source||''}`
    };
    allEdges.push(edge);
    if (r !== 'related') structEdges.push(edge);
  });

  // vis.js
  const nodesDS = new vis.DataSet(visNodes);
  const edgesDS = new vis.DataSet(allEdges);
  const container = document.getElementById('container');
  const opts = {
    nodes:{shape:'dot',font:{size:12,color:'#333'},borderWidth:1},
    edges:{smooth:{enabled:true,type:'continuous',roundness:0.4},arrows:{to:{enabled:true,scaleFactor:0.4}}},
    physics:{
      stabilization:{iterations:150,fit:true},
      barnesHut:{gravitationalConstant:-18000,centralGravity:0.3,springLength:350,springConstant:0.005,damping:0.4},
      maxVelocity:30,minVelocity:0.5
    },
    interaction:{hover:true,zoomView:true,dragView:true,navigationButtons:true}
  };
  network = new vis.Network(container, {nodes:nodesDS,edges:edgesDS}, opts);

  // Phase legend click → filter
  document.querySelectorAll('.ph-leg').forEach(el => {
    el.addEventListener('click', () => {
      const ph = el.dataset.phase;
      el.classList.toggle('off');
      const offPhases = new Set();
      document.querySelectorAll('.ph-leg.off').forEach(x => offPhases.add(x.dataset.phase));
      const updates = [];
      visNodes.forEach(n => {
        updates.push({id:n.id, hidden:offPhases.has(nodePhase[n.id])});
      });
      nodesDS.update(updates);
    });
  });

  // Edge type legend click → toggle
  document.querySelectorAll('.leg-item').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.type;
      el.classList.toggle('off');
      const offTypes = new Set();
      document.querySelectorAll('.leg-item.off').forEach(x => offTypes.add(x.dataset.type));
      const updates = [];
      const currentEdges = showAll ? allEdges : structEdges;
      currentEdges.forEach(e => {
        updates.push({id:e.id, hidden:offTypes.has(e._type)});
      });
      edgesDS.update(updates);
    });
  });

  // Stabilize then freeze
  network.on('stabilizationIterationsDone', () => {
    if (showAll) {
      network.setOptions({physics:{enabled:false}});
      physicsOn = false;
    }
  });

  // Click → detail
  network.on('click', p => {
    if (p.nodes.length) {
      showDetail(p.nodes[0]);
    } else if (!p.edges.length) {
      document.getElementById('detail').style.display = 'none';
    }
  });

  // Double-click → open docs
  network.on('doubleClick', p => {
    if (p.nodes.length) {
      const n = idMap[p.nodes[0]];
      if (n && n.url) window.open(n.url, '_blank');
    }
  });

  document.getElementById('search').focus();
})();

function toggleEdges(mode) {
  showAll = (mode === 'all');
  const ds = network.body.data.edges;
  const newEdges = mode === 'all' ? allEdges : structEdges;
  ds.clear();
  // re-apply legend filter state before adding
  const offTypes = new Set();
  document.querySelectorAll('.leg-item.off').forEach(x => offTypes.add(x.dataset.type));
  const visible = offTypes.size
    ? newEdges.filter(e => !offTypes.has(e._type))
    : newEdges;
  ds.add(visible);
  document.getElementById('btn-all').classList.toggle('active', mode==='all');
  document.getElementById('btn-struct').classList.toggle('active', mode==='struct');
}

function togglePhysics() {
  physicsOn = !physicsOn;
  network.setOptions({physics:{enabled:physicsOn}});
  document.getElementById('btn-freeze').classList.toggle('active', !physicsOn);
  if (physicsOn) {
    // Re-stabilize then auto-freeze
    network.once('stabilizationIterationsDone', () => {
      network.setOptions({physics:{enabled:false}});
      physicsOn = false;
      document.getElementById('btn-freeze').classList.add('active');
    });
  }
}

let searchTimer = null;
function doSearch() {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(filterSearch, 250);
}

function filterSearch() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const counter = document.getElementById('match-count');
  if (!q) {
    counter.style.display = 'none';
    const nu = []; fullData.forEach(n => {
      nu.push({id:n.id, hidden:false, size:nodePhase[n.id]==='integ'?18:nodePhase[n.id]==='howto'?10:13,
        font:{size:nodePhase[n.id]==='integ'?14:nodePhase[n.id]==='howto'?10:12}});
    });
    network.body.data.nodes.update(nu);
    const eu = [];
    network.body.data.edges.forEach(e => { eu.push({id:e.id, hidden:false}); });
    network.body.data.edges.update(eu);
    network.fit({animation:true});
    return;
  }

  // Match: exact id > title contains > content contains
  let match = new Set(), exact = new Set(), titleMatch = new Set(), bodyMatch = new Set();
  fullData.forEach(n => {
    const tl = n.title.toLowerCase(), idl = n.id.toLowerCase();
    const body = `${n.synopsis||''} ${n.description||''}`.toLowerCase();
    if (idl === q) exact.add(n.id);
    else if (tl.includes(q)) titleMatch.add(n.id);
    else if (body.includes(q)) bodyMatch.add(n.id);
  });
  if (exact.size) match = exact;
  else if (titleMatch.size) match = titleMatch;
  else match = bodyMatch;

  counter.style.display = 'inline';
  counter.textContent = match.size + ' match' + (match.size!==1?'es':'');

  // Visible = matches + 1-hop neighbors
  const visible = new Set(match);
  allEdges.forEach(e => {
    if (match.has(e.from)) visible.add(e.to);
    if (match.has(e.to)) visible.add(e.from);
  });

  const nu = [];
  network.body.data.nodes.forEach(n => {
    const isMatch = match.has(n.id);
    if (isMatch) {
      nu.push({id:n.id, hidden:false, size:22, font:{size:16,color:'#000'}, borderWidth:3, color:{border:'#333'}});
    } else if (visible.has(n.id)) {
      nu.push({id:n.id, hidden:false, size:nodePhase[n.id]==='integ'?18:nodePhase[n.id]==='howto'?10:13, font:{size:nodePhase[n.id]==='integ'?14:nodePhase[n.id]==='howto'?10:12}, borderWidth:1, color:{border:null}});
    } else {
      nu.push({id:n.id, hidden:true});
    }
  });
  network.body.data.nodes.update(nu);

  const eu = [];
  network.body.data.edges.forEach(e => {
    eu.push({id:e.id, hidden:!visible.has(e.from)||!visible.has(e.to)});
  });
  network.body.data.edges.update(eu);

  if (visible.size) {
    network.fit({nodes:Array.from(visible), animation:true});
    if (match.size <= 5) {
      setTimeout(() => network.fit({nodes:Array.from(match), animation:true}), 700);
    }
  }
}

async function showDetail(nid) {
  const n = idMap[nid]; if (!n) return;
  const d = document.getElementById('detail'); d.style.display = 'block';
  document.getElementById('dt').textContent = n.title||n.id;
  document.getElementById('dty').innerHTML =
    `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PC[n.phase]};vertical-align:middle;margin-right:4px"></span>${PL[n.phase]||n.phase} · <span style="color:#999">loading...</span>`;

  let path;
  try {
	    const cat = n.category;
	    path = cat && cat !== 'root' ? `lammps_kb/${cat}/${n.id}.md` : `lammps_kb/${n.id}.md`;
	    const resp = await fetch(path);
    if (!resp.ok) throw new Error(`Not found (${resp.status})`);
    let md = await resp.text();

    // Strip YAML frontmatter (between first two --- lines)
    md = md.replace(/^---[\s\S]*?---\n*/, '');

    // Clean up markdown for plain-text display (VASP style)
    md = md.replace(/\*\*(.+?)\*\*/g, '$1');  // bold → plain
    md = md.replace(/\|/g, '|');

    document.getElementById('dty').innerHTML =
      `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PC[n.phase]};vertical-align:middle;margin-right:4px"></span>${PL[n.phase]||n.phase} · <a href="${n.url||'#'}" target="_blank" style="color:#5e81ac;font-size:10px">docs.lammps.org ↗ (always latest)</a>`;

    document.getElementById('dc').innerHTML =
      `<div style="white-space:pre-wrap;font-family:SFMono-Regular,Consolas,monospace;font-size:11px;color:#333;line-height:1.5;max-height:60vh;overflow-y:auto;background:transparent;padding:0">${md}</div>`;

  } catch (err) {
    document.getElementById('dty').innerHTML =
      `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PC[n.phase]};vertical-align:middle;margin-right:4px"></span>${PL[n.phase]||n.phase}`;
    document.getElementById('dc').innerHTML =
      `<div style="color:#999;font-size:11px;padding:20px 0">Knowledge base article not found.<br><br><code>${path}</code><br><br><a href="${n.url||'#'}" target="_blank">Open docs.lammps.org ↗</a></div>`;
  }
}

function selectAndShow(id) {
  network.selectNodes([id]);
  network.focus(id, {scale:1.5, animation:true});
  showDetail(id);
}
</script>
</body>
</html>
